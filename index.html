    </section>

    <section class="programs" id="programs" aria-labelledby="programs-title"><span class="eyebrow" data-content="programs.eyebrow"></span><h2 class="stacked-lines programs-title" id="programs-title" data-lines="programs.titleLines"></h2><ul class="program-list" id="program-list"></ul></section>

    <section class="facilities section-card" id="facilities" aria-labelledby="facilities-title"><div class="facilities-grid"><div class="facilities-intro"><img class="facilities-icon" id="facilities-icon" loading="lazy" data-reveal style="--reveal-scale:.85;--reveal-y:0"><h2 class="stacked-lines facilities-title" id="facilities-title" data-lines="facilities.titleLines"></h2><p class="word-fade" id="facilities-body"></p></div><div class="court-list" id="court-list"></div></div></section>

    <section class="stats section-card" aria-labelledby="stats-title"><span class="eyebrow light" data-content="stats.eyebrow"></span><h2 class="stacked-lines stats-title" id="stats-title" data-lines="stats.titleLines"></h2><dl class="stat-list" id="stat-list"></dl></section>

    <section class="testimonials" id="testimonials" aria-labelledby="testimonials-title"><span class="eyebrow" data-content="testimonials.eyebrow"></span><h2 class="stacked-lines testimonials-title" id="testimonials-title" data-lines="testimonials.titleLines"></h2><ul class="testimonial-list" id="testimonial-list"></ul></section>

    <footer class="footer section-card" id="contact"><div class="footer-cta"><div><span class="eyebrow light" data-content="footer.ctaEyebrow"></span><p class="stacked-lines footer-title" data-lines="footer.ctaTitleLines"></p></div><button class="pill pill-light js-book" data-reveal style="--reveal-y:1.25rem;--reveal-delay:150ms"><span data-content="footer.ctaButton"></span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div><div class="footer-grid"><div class="footer-brand"><div class="brand-lockup"><img class="brand-mark" src="assets/karma-yoga-mark.png" alt="" aria-hidden="true"><span data-content="global.brandName"></span></div><p data-content="footer.brandBlurb"></p><address id="footer-address"></address></div><div id="footer-columns" style="display:contents"></div></div><div class="footer-bottom"><span data-content="footer.copyright"></span><nav class="footer-inline-nav" id="footer-socials"></nav><nav class="footer-inline-nav" id="footer-legal"></nav></div></footer>
  </main>

  <div class="overlay" id="menu-overlay" aria-hidden="true"><div class="menu-backdrop" id="menu-backdrop"></div><div class="menu-panel"><div class="menu-top"><div class="brand-lockup"><img class="brand-mark" src="assets/karma-yoga-mark.png" alt="" aria-hidden="true"><span data-content="global.brandName"></span></div><button class="icon-button menu-close x-button" id="menu-close"><span class="sr-only" data-content="menu.closeLabel"></span><svg class="x-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><nav class="menu-nav" id="menu-nav"></nav><div class="menu-bottom"><button class="pill pill-light" id="menu-book"><span data-content="menu.bookVisitButton"></span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><nav class="menu-socials" id="menu-socials"></nav></div></div></div>

  <div class="modal" id="contact-modal" aria-hidden="true"><div class="modal-backdrop" id="modal-backdrop"></div><div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><span class="eyebrow" data-content="contactModal.eyebrow"></span><h2 class="stacked-lines modal-title" id="modal-title" data-lines="contactModal.titleLines"></h2><button class="icon-button modal-close x-button" id="modal-close"><span class="sr-only" data-content="contactModal.closeLabel"></span><svg class="x-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><form class="modal-form" id="contact-form" novalidate><div class="field"><label for="visit-name" data-content="contactModal.fields.name.label"></label><input id="visit-name" name="name" type="text"></div><div class="field"><label for="visit-email" data-content="contactModal.fields.email.label"></label><input id="visit-email" name="email" type="email"></div><div class="field"><label for="visit-message" data-content="contactModal.fields.message.label"></label><textarea id="visit-message" name="message" rows="3"></textarea></div><button class="pill pill-solid modal-submit" type="submit" data-content="contactModal.submitButton"></button></form><div class="success-panel" id="success-panel"><div class="success-check"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div><h3 data-content="contactModal.successTitle"></h3><p id="success-message"></p><button class="pill pill-solid" id="modal-done" data-content="contactModal.doneButton"></button></div></div></div>

  <script type="module">
    import Lenis from "lenis";

    const C = SITE_CONTENT;
    const $ = (s, p=document) => p.querySelector(s);
    const $$ = (s, p=document) => [...p.querySelectorAll(s)];
    const pathValue = path => path.split('.').reduce((value,key)=>value?.[key], C);
    const svgArrow = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    const escapeHTML = value => String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const linkHTML = item => `<a href="${escapeHTML(item.href)}">${escapeHTML(item.label)}</a>`;

    document.title = C.global.documentTitle;
    $$('[data-content]').forEach(el => { el.textContent = pathValue(el.dataset.content) ?? ''; });
    $('#visit-name').placeholder = C.contactModal.fields.name.placeholder;
    $('#visit-email').placeholder = C.contactModal.fields.email.placeholder;
    $('#visit-message').placeholder = C.contactModal.fields.message.placeholder;
    $('#hero-media img').alt = C.hero.imageAlt;
    $('#menu-trigger').setAttribute('aria-label', C.header.openMenuLabel);
    $('#menu-close').setAttribute('aria-label', C.menu.closeLabel);
    $('#modal-close').setAttribute('aria-label', C.contactModal.closeLabel);
    $('#coach-prev').setAttribute('aria-label', C.trust.previousSlideLabel);
    $('#coach-next').setAttribute('aria-label', C.trust.nextSlideLabel);

    const makeLines = (el, lines, stagger=120, base=0, dur=950) => {
      el.innerHTML = lines.map((line,i)=>`<span class="clip-line"><span class="clip-inner" style="--delay:${base+i*stagger}ms;--dur:${dur}ms">${escapeHTML(line)}</span></span>`).join('');
    };
    $$('[data-lines]').forEach(el => makeLines(el, pathValue(el.dataset.lines)));
    $('#hero-title').innerHTML = C.hero.title.split(/\s+/).map((word,i)=>`<span class="clip-word"><span class="clip-inner" style="--delay:${i*140}ms;--dur:1100ms">${escapeHTML(word)}</span></span>`).join('');
    makeLines($('#hero-tagline'), C.hero.taglineLines, 110, 350, 900);

    $('#header-nav').innerHTML = C.header.leftNavigation.map(linkHTML).join('');
    $('#membership').innerHTML = `<div class="member-copy"><strong class="member-value">${escapeHTML(C.hero.membership.value)}</strong><div class="avatars" aria-hidden="true"><i style="background:#a9b9a0"></i><i style="background:#d8c7a5"></i><i style="background:#7f9277"></i><i style="background:#fffdf8"></i></div><span class="member-caption">${escapeHTML(C.hero.membership.caption)}</span></div><img src="${escapeHTML(C.hero.membership.image)}" loading="lazy" alt="${escapeHTML(C.hero.membership.imageAlt)}">`;

    const renderDots = (root, count, active, handler, labels=[]) => {
      root.innerHTML = Array.from({length:count},(_,i)=>`<button class="dot" aria-label="${escapeHTML(labels[i] ?? '')}" aria-current="${i===active}" data-index="${i}"><span></span></button>`).join('');
      [...root.children].forEach(button => button.addEventListener('click',()=>handler(Number(button.dataset.index))));
    };
    let collectionIndex=0, collectionTimer;
    const showCollection = (index, animate=true) => {
      const card=$('#collection-card'), item=C.hero.collections[index];
      const update=()=>{card.innerHTML=`<img src="${escapeHTML(item.image)}" loading="lazy" alt="${escapeHTML(item.imageAlt)}"><div class="collection-copy"><div class="collection-brand">${escapeHTML(item.brand)}</div><div class="collection-title">${escapeHTML(item.title)}</div><a class="collection-cta" href="#shop"><span>${escapeHTML(item.cta)}</span>${svgArrow}</a></div>`;card.classList.remove('changing');};
      animate ? (card.classList.add('changing'),setTimeout(update,220)) : update();
      collectionIndex=index;renderDots($('#collection-dots'),C.hero.collections.length,index,i=>{showCollection(i);restartCollection();},C.hero.collections.map(item=>item.title));
    };
    const restartCollection=()=>{clearInterval(collectionTimer);collectionTimer=setInterval(()=>showCollection((collectionIndex+1)%C.hero.collections.length),3800)};
    showCollection(0,false);

    $('#program-list').innerHTML=C.programs.items.map((item,i)=>`<li><a class="program-link" id="${escapeHTML(item.href.slice(1))}" href="${escapeHTML(item.href)}"><div class="program-row" data-reveal style="--reveal-y:1.625rem;--reveal-delay:${i*90}ms"><span class="program-index">${escapeHTML(item.index)}</span><div class="program-copy"><h3 class="program-name">${escapeHTML(item.name)}</h3><p class="program-description">${escapeHTML(item.description)}</p></div><span class="program-arrow">${svgArrow}</span></div></a></li>`).join('');

    $('#facilities-icon').src=C.facilities.introImage;$('#facilities-icon').alt=C.facilities.introImageAlt;
    $('#facilities-body').innerHTML=C.facilities.body.split(/\s+/).map((word,i)=>`<span style="--delay:${250+i*28}ms">${escapeHTML(word)}&nbsp;</span>`).join('');
    $('#court-list').innerHTML=C.facilities.courts.map((court,i)=>`<figure class="court-card" data-reveal style="--reveal-y:3rem;--reveal-delay:${i*140}ms"><img src="${escapeHTML(court.image)}" loading="lazy" alt="${escapeHTML(court.imageAlt)}"><figcaption class="court-caption ${escapeHTML(court.tone)}"><strong>${escapeHTML(court.name)}</strong><span>${escapeHTML(court.description)}</span></figcaption></figure>`).join('');
    $('#stat-list').innerHTML=C.stats.items.map((item,i)=>`<div class="stat-cell" data-reveal style="--reveal-y:1.875rem;--reveal-delay:${i*110}ms"><dt class="sr-only">${escapeHTML(item.label)}</dt><dd><div class="stat-value">${escapeHTML(item.value)}</div><div class="stat-label">${escapeHTML(item.label)}</div></dd></div>`).join('');
    $('#testimonial-list').innerHTML=C.testimonials.items.map((item,i)=>`<li data-reveal style="--reveal-y:2.5rem;--reveal-delay:${i*120}ms"><figure class="testimonial-card"><div><div class="quote-mark" aria-hidden="true">“</div><blockquote>${escapeHTML(item.quote)}</blockquote></div><figcaption><strong>${escapeHTML(item.name)}</strong><span>${escapeHTML(item.role)}</span></figcaption></figure></li>`).join('');

    $('#footer-address').innerHTML=`<a href="${escapeHTML(C.footer.contact.emailHref)}">${escapeHTML(C.footer.contact.email)}</a><a href="${escapeHTML(C.footer.contact.phoneHref)}">${escapeHTML(C.footer.contact.phone)}</a><span>${escapeHTML(C.footer.contact.address)}</span>`;
    $('#footer-columns').innerHTML=C.footer.columns.map(column=>`<nav class="footer-nav"><h3>${escapeHTML(column.heading)}</h3><ul>${column.links.map(item=>`<li>${linkHTML(item)}</li>`).join('')}</ul></nav>`).join('');
    $('#footer-socials').innerHTML=C.footer.socialLinks.map(linkHTML).join('');$('#footer-legal').innerHTML=C.footer.legalLinks.map(linkHTML).join('');
    $('#menu-nav').innerHTML=C.menu.links.map((item,i)=>`<a class="menu-link" href="${escapeHTML(item.href)}" style="--delay:${120+i*70}ms">${escapeHTML(item.label)}</a>`).join('');
    $('#menu-socials').innerHTML=C.menu.socialLinks.map(linkHTML).join('');

    let coachIndex=0;
    const renderGhost = words => {$('#trust-title').innerHTML=`<span class="ghost-row"><span class="clip-word ghost-word"><span class="clip-inner">${escapeHTML(words[0])}</span></span><span class="clip-word ghost-word"><span class="clip-inner" style="--delay:80ms">${escapeHTML(words[1])}</span></span></span><span class="ghost-row"><span class="clip-word ghost-word accent"><span class="clip-inner" style="--delay:160ms">${escapeHTML(words[2])}</span></span><span class="clip-word ghost-word"><span class="clip-inner" style="--delay:240ms">${escapeHTML(words[3])}</span></span></span>`;requestAnimationFrame(()=>$('#trust-title').classList.add('is-visible'));};
    const showCoach=(index,animate=true)=>{const item=C.trust.slides[index],img=$('#coach-image');const update=()=>{img.src=item.image;img.alt=item.imageAlt;$('#coach-name').textContent=item.name;$('#coach-role').textContent=item.role;img.classList.remove('changing');};animate?(img.classList.add('changing'),setTimeout(update,180)):update();coachIndex=index;renderGhost(item.headlineWords);renderDots($('#coach-dots'),C.trust.slides.length,index,showCoach,C.trust.slides.map(slide=>slide.name))};
    showCoach(0,false);$('#coach-prev').addEventListener('click',()=>showCoach((coachIndex-1+C.trust.slides.length)%C.trust.slides.length));$('#coach-next').addEventListener('click',()=>showCoach((coachIndex+1)%C.trust.slides.length));

    const inview=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');inview.unobserve(entry.target)}}),{threshold:.14});
    $$('[data-reveal],.stacked-lines,.word-fade').forEach(el=>inview.observe(el));

    const lenis=new Lenis({smoothWheel:true});
    let ready=false, uiLock=null;
    const raf=t=>{lenis.raf(t);updateParallax();requestAnimationFrame(raf)};requestAnimationFrame(raf);
    const lock=(reason)=>{uiLock=reason;lenis.stop();document.documentElement.classList.add('scroll-lock');document.body.classList.add('is-locked')};
    const unlock=(reason)=>{if(uiLock!==reason)return;uiLock=null;document.documentElement.classList.remove('scroll-lock');document.body.classList.remove('is-locked');lenis.start()};
    lock('loader');window.scrollTo(0,0);

    const updateParallax=()=>{const hero=$('.hero'),rect=hero.getBoundingClientRect(),progress=Math.max(0,Math.min(1,-rect.top/Math.max(1,rect.height))),heroShift=innerWidth<=640?3:1.8;$('#hero-media').style.transform=`translateY(${progress*heroShift}%)`;const trust=$('.trust'),tr=trust.getBoundingClientRect(),tp=Math.max(0,Math.min(1,(innerHeight-tr.top)/(innerHeight+tr.height)));const pairs=[[-3,3],[3,-3],[-2,4],[4,-3]];$$('.ghost-word').forEach((word,i)=>{const [a,b]=pairs[i];word.style.transform=`translateX(${a+(b-a)*tp}%)`})};

    const spring=(from,to,tension,friction,onUpdate,onDone)=>{let x=from,v=0,last=performance.now();const step=now=>{const dt=Math.min((now-last)/1000,.032);last=now;v+=(-tension*(x-to)-friction*v)*dt;x+=v*dt;onUpdate(x);if(Math.abs(x-to)>.001||Math.abs(v)>.001)requestAnimationFrame(step);else{onUpdate(to);onDone?.()}};requestAnimationFrame(step)};

    const menu=$('#menu-overlay'),modal=$('#contact-modal');
    const openMenu=()=>{lock('menu');menu.classList.add('open');menu.setAttribute('aria-hidden','false');$('#menu-close').focus()};
    const closeMenu=(focus=true)=>{menu.classList.remove('open');menu.setAttribute('aria-hidden','true');unlock('menu');if(focus)$('#menu-trigger').focus()};
    $('#menu-trigger').addEventListener('click',openMenu);$('#menu-close').addEventListener('click',()=>closeMenu());$('#menu-backdrop').addEventListener('click',()=>closeMenu());
    $$('.menu-link').forEach(link=>link.addEventListener('click',e=>{e.preventDefault();const target=$(link.getAttribute('href'));closeMenu(false);if(target)lenis.scrollTo(target,{offset:0,duration:1.2})}));

    const openModal=()=>{if(menu.classList.contains('open'))closeMenu(false);lock('modal');modal.classList.add('open');modal.setAttribute('aria-hidden','false');setTimeout(()=>$('#visit-name').focus(),120)};
    const closeModal=()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true');unlock('modal');setTimeout(()=>{$('#contact-form').reset();$('#contact-form').style.display='flex';$('#success-panel').classList.remove('show');$('#success-message').textContent=''},350)};
    $$('.js-book').forEach(button=>button.addEventListener('click',openModal));$('#menu-book').addEventListener('click',openModal);$('#modal-close').addEventListener('click',closeModal);$('#modal-backdrop').addEventListener('click',closeModal);$('#modal-done').addEventListener('click',closeModal);
    $('#contact-form').addEventListener('submit',e=>{e.preventDefault();const button=$('.modal-submit'),firstName=$('#visit-name').value.trim().split(/\s+/)[0]||C.contactModal.successFallbackName;button.disabled=true;button.textContent=C.contactModal.submittingButton;setTimeout(()=>{button.disabled=false;button.textContent=C.contactModal.submitButton;$('#contact-form').style.display='none';$('#success-message').textContent=C.contactModal.successMessageTemplate.replace('{firstName}',firstName);$('#success-panel').classList.add('show');$('#modal-done').focus()},650)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal.classList.contains('open'))closeModal();else if(menu.classList.contains('open'))closeMenu()}});
    $$('a[href^="#"]:not(.menu-link)').forEach(link=>link.addEventListener('click',e=>{const target=$(link.getAttribute('href'));if(target){e.preventDefault();lenis.scrollTo(target,{duration:1.2})}}));

    const scaleRoot=()=>{const FONT_BASE=16,BASE_W=1920,COEF=.6666,reduction=((BASE_W-innerWidth)/BASE_W)*100*COEF,size=FONT_BASE-(FONT_BASE*reduction)/100;if(size>FONT_BASE)document.documentElement.style.fontSize=size+'px';else document.documentElement.style.removeProperty('font-size')};scaleRoot();addEventListener('resize',scaleRoot);
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches, MIN_VISIBLE_MS=reduced?200:1400,MAX_VISIBLE_MS=2600,EXIT_MS=reduced?0:850;let countdownStarted=false,revealed=false;
    const finishReveal=()=>{if(revealed)return;revealed=true;ready=true;document.body.classList.add('reveal-ready');unlock('loader');restartCollection();$('#loader').classList.add('exit');setTimeout(()=>$('#loader').remove(),EXIT_MS)};
    const startRevealCountdown=()=>{if(countdownStarted)return;countdownStarted=true;setTimeout(finishReveal,MIN_VISIBLE_MS)};
    if(document.readyState==='complete')startRevealCountdown();else addEventListener('load',startRevealCountdown,{once:true});setTimeout(finishReveal,MAX_VISIBLE_MS);
  </script>
</body>
</html>
